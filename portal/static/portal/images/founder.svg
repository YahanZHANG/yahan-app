<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="t">
  <title id="t">Yapp 開発者のイラスト</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6ecfa"/>
      <stop offset="1" stop-color="#a9d3f0"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2c28"/>
      <stop offset="1" stop-color="#17110f"/>
    </linearGradient>
    <pattern id="tortoise" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#7a4a2a"/>
      <circle cx="4" cy="4" r="3" fill="#3b2214"/>
      <circle cx="11" cy="10" r="2.4" fill="#a8703f"/>
    </pattern>
    <clipPath id="circle"><circle cx="160" cy="160" r="150"/></clipPath>
  </defs>

  <circle cx="160" cy="160" r="150" fill="url(#bg)"/>

  <g clip-path="url(#circle)">
    <!-- ceiling lines like the photo, very soft -->
    <path d="M30 70 L120 40 L300 90" stroke="#ffffff" stroke-width="6" fill="none" opacity=".5"/>

    <g transform="rotate(-8 160 170)">
      <!-- hair behind, falling past the shoulders -->
      <path d="M86 150 C80 84 122 50 168 52 C218 54 250 92 244 156 L250 290 C214 304 112 304 80 290 Z" fill="url(#hair)"/>

      <!-- body: soft floral top -->
      <path d="M52 340 C58 282 100 258 162 256 C224 258 266 282 272 340 Z" fill="#f3efe8"/>
      <g fill="#c7a9b6" opacity=".7">
        <circle cx="96" cy="300" r="6"/><circle cx="130" cy="318" r="5"/><circle cx="200" cy="312" r="6"/><circle cx="232" cy="296" r="5"/>
      </g>

      <!-- neck -->
      <path d="M144 222 L144 258 C152 266 172 266 180 258 L180 222 Z" fill="#f1cdb3"/>

      <!-- face -->
      <path d="M106 150 C106 104 132 84 162 84 C194 84 218 106 218 152 C218 206 192 236 162 236 C130 236 106 204 106 150 Z" fill="#fbe0cc"/>
      <!-- left ear (visible, hair tucked) -->
      <ellipse cx="104" cy="160" rx="10" ry="15" fill="#f1cdb3"/>
      <path d="M102 152 C106 156 106 166 102 170" stroke="#d9a98c" stroke-width="2" fill="none"/>

      <!-- side-swept bangs: part on the left, sweeping across the forehead -->
      <path d="M100 150 C92 100 124 60 172 60 C214 62 240 94 236 150 C232 126 224 110 214 100 C200 96 186 94 176 92 C150 92 128 100 114 116 C108 126 104 138 100 150 Z" fill="url(#hair)"/>
      <path d="M128 98 C150 90 180 94 214 112 C220 118 224 126 226 134 C210 116 186 104 160 100 C148 98 136 98 128 98 Z" fill="url(#hair)"/>
      <!-- hair on the right side, in front of the ear -->
      <path d="M214 120 C226 150 226 210 220 262 L246 262 C252 200 246 140 232 118 Z" fill="url(#hair)"/>

      <!-- eyebrows -->
      <path d="M124 134 C132 129 143 129 150 132" stroke="#4a3530" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path d="M174 132 C181 129 192 129 200 134" stroke="#4a3530" stroke-width="3.5" stroke-linecap="round" fill="none"/>

      <!-- smiling eyes -->
      <ellipse cx="138" cy="158" rx="6.5" ry="7" fill="#2a1d1a"/>
      <ellipse cx="186" cy="158" rx="6.5" ry="7" fill="#2a1d1a"/>
      <path d="M128 153 C133 147 143 147 148 153" stroke="#2a1d1a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <path d="M176 153 C181 147 191 147 196 153" stroke="#2a1d1a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      <circle cx="140.5" cy="155.5" r="2.2" fill="#ffffff"/>
      <circle cx="188.5" cy="155.5" r="2.2" fill="#ffffff"/>
      <path d="M126 162 C132 166 144 166 150 162" stroke="#e6b9a0" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M174 162 C180 166 192 166 198 162" stroke="#e6b9a0" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- round tortoiseshell glasses -->
      <ellipse cx="138" cy="157" rx="23" ry="21" fill="#ffffff" fill-opacity=".16" stroke="url(#tortoise)" stroke-width="5.5"/>
      <ellipse cx="186" cy="157" rx="23" ry="21" fill="#ffffff" fill-opacity=".16" stroke="url(#tortoise)" stroke-width="5.5"/>
      <path d="M160 152 C162 148 164 148 164 152" stroke="#5a3520" stroke-width="4" fill="none"/>
      <path d="M115 152 L104 146" stroke="#5a3520" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M209 152 L218 148" stroke="#5a3520" stroke-width="4.5" stroke-linecap="round"/>

      <!-- cheeks -->
      <ellipse cx="126" cy="190" rx="11" ry="6" fill="#f2a08e" opacity=".45"/>
      <ellipse cx="198" cy="190" rx="11" ry="6" fill="#f2a08e" opacity=".45"/>

      <!-- nose -->
      <path d="M162 170 C160 180 158 184 164 186" stroke="#d8a084" stroke-width="3" stroke-linecap="round" fill="none"/>

      <!-- big toothy smile -->
      <path d="M134 198 C146 222 180 222 192 198 Z" fill="#a8404a"/>
      <path d="M136 199 C148 207 178 207 190 199 L190 198 L134 198 Z" fill="#ffffff"/>
      <path d="M134 198 C146 222 180 222 192 198" stroke="#c76a6e" stroke-width="3" fill="none" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
