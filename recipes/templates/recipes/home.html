{% extends "recipes/base.html" %}

{% block title %}
    レシピ | Yahan App
{% endblock %}


{% block recipes_content %}

    <main class="recipe-page recipe-home-page">

        <a
            href="{% url 'portal:home' %}"
            class="recipes-portal-link"
        >
            ← Yahan App
        </a>

        <!-- 今日の料理を探す -->
        <section class="recipe-section">

            <div class="recipe-route-grid">


                <!-- 食材 -->
                    <a
                        href="{% url 'recipes:find_by_ingredients' %}"
                        class="recipe-route-card"
                    >

                    <div class="route-icon">
                        🥕
                    </div>

                    <div class="route-copy">

                        <h3>
                            食材から探す
                        </h3>

                    </div>

                </a>



                <!-- 気分 -->
                <a
                    href="{% url 'recipes:find_by_mood' %}"
                    class="recipe-route-card"
                >

                    <div class="route-icon">
                        😀
                    </div>

                    <div class="route-copy">

                        <h3>
                            気分から探す
                        </h3>

                    </div>

                </a>



                <!-- 栄養 -->
                <a
                    href="{% url 'recipes:find_by_nutrition' %}"
                    class="recipe-route-card"
                >

                    <div class="route-icon">
                        📊
                    </div>

                    <div class="route-copy">

                        <h3>
                            栄養から探す
                        </h3>
                    </div>

                </a>


                <!-- ランダム -->
                <a
                    href="{% url 'recipes:random_recipe' %}"
                    class="recipe-route-card"
                >

                    <div class="route-icon">
                        🎲
                    </div>


                    <div class="route-copy">

                        <h3>
                            ランダムに決める
                        </h3>

                    </div>

                </a>


            </div>

        </section>

    </main>

    {% endblock %}
