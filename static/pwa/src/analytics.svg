<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B6CF0"/>
      <stop offset="1" stop-color="#3B2A8F"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCD6FA"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <path d="M0 700 C 300 620, 600 660, 1024 780 L1024 1024 L0 1024 Z" fill="#000" opacity="0.12"/>
  <!-- bars -->
  <rect x="230" y="560" width="110" height="230" rx="28" fill="url(#bar)"/>
  <rect x="390" y="450" width="110" height="340" rx="28" fill="url(#bar)"/>
  <rect x="550" y="510" width="110" height="280" rx="28" fill="url(#bar)"/>
  <rect x="710" y="350" width="110" height="440" rx="28" fill="url(#bar)"/>
  <!-- trend line -->
  <polyline points="230,420 420,300 590,360 800,200" fill="none" stroke="url(#line)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="800" cy="200" r="46" fill="#FF8A3D"/>
  <circle cx="800" cy="200" r="20" fill="#fff"/>
</svg>
