{% extends "base.html" %}
{% load static %}

{% block title %}ブロック崩し{% endblock %}

{% block content %}
<section
    id="game-shell"
    class="block-breaker-page"
>
    <button
        type="button"
        id="exit-fullscreen-button"
        class="exit-fullscreen-button"
        aria-label="全画面を終了"
    >
        × 全画面終了
    </button>

    <div class="block-breaker-heading fullscreen-hidden">
        <a
            class="back-to-games"
            href="{% url 'games:game_list' %}"
        >
            ゲーム一覧
        </a>

        <h1 class="block-breaker-title">
            ブロック崩し
        </h1>

        <button
            type="button"
            id="fullscreen-button"
            class="fullscreen-button"
        >
            ⛶ 全画面
        </button>
    </div>

    <div class="game-status">
        <div class="status-item fullscreen-hidden">
            <span>ステージ</span>
            <strong id="stage-display">1</strong>
        </div>

        <div class="status-item fullscreen-hidden">
            <span>スコア</span>
            <strong id="score-display">0</strong>
        </div>

        <div class="status-item lives-status">
            <span>残機</span>
            <strong id="lives-display">3</strong>
        </div>

        <div
            id="powerup-status"
            class="status-item powerup-status is-hidden fullscreen-hidden"
        >
            <span>パワー</span>
            <strong id="powerup-display">🔥 8.0</strong>
        </div>
    </div>

    <div class="stage-selector fullscreen-hidden">
        <label for="stage-select">
            ステージ選択
        </label>

        <select id="stage-select">
            <option value="0">ステージ1：はじめの壁</option>
            <option value="1">ステージ2：ダイヤモンド</option>
            <option value="2">ステージ3：鋼鉄の迷路</option>
            <option value="3">ステージ4：高速要塞</option>
            <option value="4">ステージ5：カオス・ブレイカー</option>
        </select>

        <button
            type="button"
            id="stage-select-button"
        >
            このステージで遊ぶ
        </button>
    </div>

    <div class="game-container">
        <div class="rotate-device-message">
            <span>↻</span>
            携帯を横向きにしてください
        </div>

        <canvas
            id="game-canvas"
            width="720"
            height="520"
        ></canvas>

        <div
            id="game-overlay"
            class="game-overlay"
        >
            <div class="overlay-panel">
                <h2 id="overlay-title">
                    ステージ1
                </h2>

                <p id="overlay-message">
                    マウスまたは指でバーを動かせる。
                </p>

                <button
                    id="start-button"
                    type="button"
                >
                    スタート
                </button>
            </div>
        </div>
    </div>

    <div class="mobile-controls">
        <button
            type="button"
            id="laser-button"
            class="control-button"
            disabled
        >
            ⚡ レーザー
        </button>

        <button
            id="pause-button"
            type="button"
        >
            一時停止
        </button>
    </div>
</section>

<link
    rel="stylesheet"
    href="{% static 'games/block_breaker/css/style.css' %}"
>

<script
    type="module"
    src="{% static 'games/block_breaker/js/game.js' %}"
></script>
{% endblock %}
