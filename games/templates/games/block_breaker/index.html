{% extends "base.html" %}
{% load static %}

{% block title %}ブロック崩し{% endblock %}

{% block content %}
<section class="block-breaker-page">
    <div class="block-breaker-heading">
        <div>
            <h1>ブロック崩し</h1>
            <p>ボールを落とさず、ブロックを全部壊そう。</p>
        </div>

        <a
            class="back-to-games"
            href="{% url 'games:game_list' %}"
        >
            ゲーム一覧
        </a>
    </div>

    <div class="game-status">
        <div class="status-item">
            <span>ステージ</span>
            <strong id="stage-display">1</strong>
        </div>

        <div class="status-item">
            <span>スコア</span>
            <strong id="score-display">0</strong>
        </div>

        <div class="status-item">
            <span>残機</span>
            <strong id="lives-display">3</strong>
        </div>

        <div
            id="powerup-status"
            class="status-item powerup-status is-hidden"
        >
            <span>パワー</span>
            <strong id="powerup-display">🔥 8.0</strong>
        </div>
    </div>

    <div class="stage-selector">
        <label for="stage-select">
            ステージ選択
        </label>

        <select id="stage-select">
            <option value="0">ステージ1：はじめの壁</option>
            <option value="1">ステージ2：ダイヤモンド</option>
            <option value="2">ステージ3：鋼鉄の迷路</option>
            <option value="3">ステージ4：高速要塞</option>
            <option value="4">ステージ5：カオス・ブレイカー</option>
        </select>

        <button
            type="button"
            id="stage-select-button"
        >
            このステージで遊ぶ
        </button>
    </div>

    <div class="game-container">
        <canvas
            id="game-canvas"
            width="720"
            height="520"
        ></canvas>

        <div id="game-overlay" class="game-overlay">
            <div class="overlay-panel">
                <h2 id="overlay-title">ステージ1</h2>

                <p id="overlay-message">
                    マウス、指、左右キーでバーを動かせる。
                </p>

                <button id="start-button" type="button">
                    スタート
                </button>
            </div>
        </div>
    </div>

    <div class="mobile-controls">

        <button
            type="button"
            id="laser-button"
            class="control-button"
            disabled
        >
            ⚡ レーザー
        </button>

        <button id="pause-button" type="button">
            一時停止
        </button>

    </div>
</section>

<link
    rel="stylesheet"
    href="{% static 'games/block_breaker/css/style.css' %}"
>

<script
    type="module"
    src="{% static 'games/block_breaker/js/game.js' %}"
></script>
{% endblock %}
