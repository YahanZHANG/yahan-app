{% extends "base.html" %}

{% block title %}ゲーム{% endblock %}

{% block content %}
<section class="games-page">
    <a href="{% url 'portal:home' %}" class="back-link">
        ← Yahan-APPに戻る
    </a>

    <h1>  </h1>
    <h1>ゲーム一覧</h1>

    <!-- 既存のゲーム一覧 -->

    <div class="game-card-list">
        <a
            class="game-card"
            href="{% url 'games:block_breaker' %}"
        >
            <div class="game-card-icon">🧱</div>

            <div class="game-card-content">
                <h2>ブロック崩し</h2>
                <p>
                    バーでボールを跳ね返して、
                    ブロックを全部壊そう。
                </p>
            </div>

            <div class="game-card-arrow">›</div>
        </a>
    </div>
</section>

<style>
    .games-page {
        max-width: 760px;
        margin: 0 auto;
        padding: 20px 16px 40px;
    }

    .games-page-header {
        margin-bottom: 20px;
    }

    .games-page-header h1 {
        margin: 0 0 6px;
    }

    .games-page-header p {
        margin: 0;
        color: #687086;
    }

    .game-card-list {
        display: grid;
        gap: 14px;
    }

    .game-card {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 18px;
        color: inherit;
        text-decoration: none;
        background: #ffffff;
        border: 1px solid #e3e6ef;
        border-radius: 18px;
        box-shadow: 0 6px 18px rgba(30, 40, 70, 0.08);
    }

    .game-card:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 22px rgba(30, 40, 70, 0.12);
    }

    .game-card-icon {
        display: grid;
        width: 56px;
        height: 56px;
        place-items: center;
        flex-shrink: 0;
        font-size: 30px;
        background: #f2f4fa;
        border-radius: 16px;
    }

    .game-card-content {
        flex: 1;
    }

    .game-card-content h2 {
        margin: 0 0 4px;
        font-size: 18px;
    }

    .game-card-content p {
        margin: 0;
        color: #687086;
        font-size: 14px;
        line-height: 1.5;
    }

    .game-card-arrow {
        font-size: 30px;
        color: #9aa1b4;
    }
</style>
{% endblock %}
