{% extends "base.html" %}
{% load static %}


{% block title %}
パスワード変更完了 | yahan-app
{% endblock %}


{% block extra_css %}

<link
    rel="stylesheet"
    href="{% static 'portal/login.css' %}"
>

{% endblock %}


{% block content %}

<div class="login-page">

    <main class="login-card">

        <div class="login-brand">

            <div class="login-brand-icon">
                ✓
            </div>

            <div>

                <p class="login-eyebrow">
                    PASSWORD UPDATED
                </p>

                <h1>
                    変更しました
                </h1>

            </div>

        </div>


        <p class="login-description">
            新しいパスワードでログインできます。
        </p>


        <a
            href="{% url 'login' %}"
            class="login-button"
        >
            <span>
                ログインする
            </span>

            <span>
                →
            </span>
        </a>

    </main>

</div>

{% endblock %}
