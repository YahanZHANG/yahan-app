{% extends "base.html" %}
{% load static %}

{% block title %}
確認メールを送信しました | Yapp
{% endblock %}

{% block content %}

<link
    rel="stylesheet"
    href="{% static 'portal/login.css' %}"
>

<div class="login-page">

    <div class="login-card">

        <p class="login-eyebrow">
            EMAIL VERIFICATION
        </p>

        <h1>
            メールをご確認ください
        </h1>

        <p class="login-description">
            未確認のアカウントが存在する場合、
            確認メールを送信しました。
        </p>

        <p class="login-description">
            メール内のリンクを開いて、
            アカウント登録を完了してください。
        </p>

        <a
            href="{% url 'login' %}"
            class="login-submit-button"
        >
            ログイン画面に戻る
        </a>

    </div>

</div>

{% endblock %}
