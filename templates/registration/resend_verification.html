{% extends "base.html" %}
{% load static %}

{% block title %}
確認メールを再送 | Yapp
{% endblock %}

{% block content %}

<link
    rel="stylesheet"
    href="{% static 'portal/login.css' %}"
>

<div class="login-page">

    <div class="login-card">

        <p class="login-eyebrow">
            EMAIL VERIFICATION
        </p>

        <h1>
            確認メールを再送
        </h1>

        <p class="login-description">
            登録したメールアドレスを入力してください。
            確認メールをもう一度送ります。
        </p>

        <form method="post">

            {% csrf_token %}

            {{ form.email }}

            {% if form.email.errors %}
                <div class="login-errors">
                    {{ form.email.errors }}
                </div>
            {% endif %}

            <button
                type="submit"
                class="login-submit-button"
            >
                確認メールを再送
            </button>

        </form>

    </div>

</div>

{% endblock %}
