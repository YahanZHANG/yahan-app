{% extends "base.html" %}

{% block title %}
パスワード変更完了 | Yapp
{% endblock %}

{% block content %}

<section
    style="
        width: min(100%, 520px);
        margin: 40px auto;
        padding: 32px;
        background: #ffffff;
        border-radius: 24px;
        text-align: center;
        box-shadow: 0 10px 35px rgba(30, 35, 60, 0.08);
    "
>

    <h1>
        パスワードを変更した
    </h1>

    <p
        style="
            color: #777d8e;
        "
    >
        次回から新しいパスワードでログインしてください。
    </p>


    <a 
        href="{{ return_url }}"
        style="
            display: inline-block;
            margin-top: 16px;
            padding: 12px 100px;
            border-radius: 999px;
            background: #6878e8;
            color: #ffffff;
            font-weight: 800;
            text-decoration: none;
        "
    >
        戻る
    </a>


</section>

{% endblock %}
