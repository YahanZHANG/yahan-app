{% extends "base.html" %}

{% block title %}
パスワード変更完了 | Yahan App
{% endblock %}

{% block content %}

<section
    style="
        width: min(100%, 520px);
        margin: 40px auto;
        padding: 32px;
        background: #ffffff;
        border-radius: 24px;
        text-align: center;
        box-shadow: 0 10px 35px rgba(30, 35, 60, 0.08);
    "
>

    <div
        style="
            margin-bottom: 14px;
            font-size: 3rem;
        "
    >
        ✓
    </div>

    <h1>
        パスワードを変更した
    </h1>

    <p
        style="
            color: #777d8e;
        "
    >
        次回から新しいパスワードでログインできる。
    </p>


    <a
        href="{% url 'portal:home' %}"
        style="
            display: inline-block;
            margin-top: 16px;
            padding: 12px 20px;
            border-radius: 999px;
            background: #6878e8;
            color: #ffffff;
            font-weight: 800;
            text-decoration: none;
        "
    >
        ポータルに戻る
    </a>

</section>

{% endblock %}
