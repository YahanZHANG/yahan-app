{% extends "base.html" %}
{% load static %}


{% block title %}
ログイン制限 | Yapp
{% endblock %}


{% block content %}

<link
    rel="stylesheet"
    href="{% static 'portal/login.css' %}"
>


<div class="login-page">

    <div class="login-card">

        <div
            class="login-brand-icon login-brand-icon-standalone"
            aria-hidden="true"
        >
            <img
                src="{% static 'portal/yapp-icon.png' %}"
                alt=""
                class="yapp-icon-fill"
            >
        </div>

        <!-- =================================================
             Message
             ================================================= -->

        <p class="login-eyebrow">
            LOGIN SECURITY
        </p>


        <h1>
            ログインを一時的に制限しています
        </h1>


        <p class="login-description">
            セキュリティ保護のため、
            ログイン試行回数が上限に達しました。
        </p>


        <p class="login-description">
            30分後にもう一度お試しください。
        </p>


        <a
            href="{% url 'login' %}"
            class="login-button"
        >
            ログイン画面に戻る
        </a>


        <div class="login-footer">

            <span>
                Yapp
            </span>

            <small>
                personal app hub
            </small>

        </div>

    </div>

</div>

{% endblock %}
