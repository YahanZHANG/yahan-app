{% extends "base.html" %}
{% load static %}


{% block title %}
メールを確認してください | yahan-app
{% endblock %}


{% block extra_css %}

<link
    rel="stylesheet"
    href="{% static 'portal/login.css' %}"
>

{% endblock %}


{% block content %}

<div class="login-page">

    <main class="login-card">

        <div class="login-brand">

            <div class="login-brand-icon">
                ✉
            </div>

            <div>

                <p class="login-eyebrow">
                    CHECK YOUR EMAIL
                </p>

                <h1>
                    メールを確認してください
                </h1>

            </div>

        </div>


        <p class="login-description">
            入力されたメールアドレスに該当するアカウントがある場合、
            パスワード再設定用のリンクを送信しました。
        </p>


        <div class="login-help">

            <a
                href="{% url 'login' %}"
                class="login-help-link"
            >
                ログインに戻る
            </a>

        </div>

    </main>

</div>

{% endblock %}
