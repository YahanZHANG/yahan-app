{% load static %}
{# Yapp のアイコン・ホーム画面追加の設定。各アプリの base.html の <head> で読み込む。 #}

<link
    rel="icon"
    href="{% static pwa_icons.folder|add:'/favicon.ico' %}"
    sizes="any"
>

<link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="{% static pwa_icons.folder|add:'/favicon-32.png' %}"
>

<link
    rel="manifest"
    href="{% url 'pwa_manifest' %}?start={{ request.path|urlencode }}"
>

<link
    rel="apple-touch-icon"
    href="{% static pwa_icons.folder|add:'/apple-touch-icon.png' %}"
>

<meta
    name="apple-mobile-web-app-capable"
    content="yes"
>

<meta
    name="mobile-web-app-capable"
    content="yes"
>

<meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
>

<meta
    name="apple-mobile-web-app-title"
    content="{{ pwa_icons.name }}"
>

<meta
    name="application-name"
    content="{{ pwa_icons.name }}"
>

{% comment %}
スマホのブラウザで開いている (まだホーム画面から開いていない) ときだけ html に yapp-installable を付ける。
「ホーム画面に追加」の入り口 (.yapp-install-only) はそのときだけ出す。
{% endcomment %}
<style>html:not(.yapp-installable) .yapp-install-only { display: none !important; }</style>
<script>
(function () {
    var ua = navigator.userAgent;
    var mobile = /iPhone|iPad|iPod|Android/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
    if (mobile && !standalone) document.documentElement.classList.add("yapp-installable");
})();
</script>
