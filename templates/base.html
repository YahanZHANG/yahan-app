{% load static %}

<!DOCTYPE html>

<html
    lang="{% block html_lang %}ja{% endblock %}"
    class="{% block html_class %}{% endblock %}"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >


    <title>

        {% block title %}
            Yahan App
        {% endblock %}

    </title>


    <!-- =====================================================
         Bootstrap
         ===================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         Bootstrap Icons
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >


    <!-- =====================================================
         Leaflet
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <!-- =====================================================
         Global CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >


    <!-- =====================================================
         Page-specific CSS
         ===================================================== -->

    {% block extra_css %}
    {% endblock %}

    <!-- =====================================================
        PWA
        ===================================================== -->

    <link
        rel="manifest"
        href="{% url 'pwa_manifest' %}"
    >

    <meta
        name="theme-color"
        content="#6577B6"
    >


    <!-- =====================================================
        iPhone / iPad
        ===================================================== -->

    <link
        rel="apple-touch-icon"
        href="{% static 'pwa/apple-touch-icon.png' %}"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Yahan App"
    >

</head>


<!-- =====================================================
     Yahan App Heartbeat
     ===================================================== -->

{% if user.is_authenticated %}

    <script
        src="{% static 'usage_analytics/heartbeat.js' %}"

        data-heartbeat-url="{% url 'usage_analytics:heartbeat' %}"

        data-csrf-token="{{ csrf_token }}"
    ></script>

{% endif %}


<body>

    <main class="container app-container page-content">

        {% block content %}
        {% endblock %}

    </main>


    <!-- =====================================================
         Bootstrap
         ===================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- =====================================================
         Leaflet
         ===================================================== -->

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <!-- =====================================================
         Global JavaScript
         ===================================================== -->

    <script
        src="{% static 'js/main.js' %}"
    ></script>


    <!-- =====================================================
         Page-specific JavaScript
         ===================================================== -->

    {% block extra_js %}
    {% endblock %}

    <!-- =====================================================
        PWA Service Worker
        ===================================================== -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(

                "load",

                () => {

                    navigator.serviceWorker.register(

                        "{% url 'pwa_service_worker' %}",

                        {
                            scope: "/",
                        }

                    ).catch(

                        (error) => {

                            console.warn(
                                "PWA registration failed:",
                                error
                            );

                        }

                    );

                }

            );

        }

    </script>

</body>

</html>
