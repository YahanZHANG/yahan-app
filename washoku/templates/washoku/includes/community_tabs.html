{% with name=request.resolver_match.url_name %}
<nav class="washoku-subtabs" aria-label="コミュニティのページ">
    <a href="{% url 'washoku:poll_list' %}" class="{% if name == 'poll_list' or name == 'poll_suggest' or kind == 'poll' %}active{% endif %}">アンケート</a>
    <a href="{% url 'washoku:question_list' %}" class="{% if name == 'question_list' or name == 'question_new' or kind == 'board' %}active{% endif %}">質問</a>
    <a href="{% url 'washoku:product_list' %}" class="{% if name == 'product_list' or kind == 'product' %}active{% endif %}">口コミ</a>
    <a href="{% url 'washoku:column_list' %}" class="{% if name == 'column_list' or kind == 'column' or kind == 'link' %}active{% endif %}">コラム</a>
</nav>
{% endwith %}
