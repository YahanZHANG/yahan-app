{% with name=request.resolver_match.url_name %}
<nav class="washoku-subtabs" aria-label="みんなのページ">
    <a href="{% url 'washoku:question_list' %}" class="{% if name == 'question_list' %}active{% endif %}">Q&amp;A</a>
    <a href="{% url 'washoku:column_list' %}" class="{% if name == 'column_list' or kind == 'column' %}active{% endif %}">コラム</a>
    <a href="{% url 'washoku:product_list' %}" class="{% if name == 'product_list' or kind == 'product' %}active{% endif %}">おすすめ商品</a>
    <a href="{% url 'washoku:link_list' %}" class="{% if name == 'link_list' or kind == 'link' %}active{% endif %}">参考リンク</a>
</nav>
{% endwith %}
