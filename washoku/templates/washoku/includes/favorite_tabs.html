{% with name=request.resolver_match.url_name %}
<nav class="washoku-quick washoku-quick-fit" aria-label="お気に入りの見方">
    <a href="{% url 'washoku:my_favorites' %}?sort=new"{% if name == 'my_favorites' and sort != 'family' %} aria-current="page" class="is-current"{% endif %}>保存した順</a>
    <a href="{% url 'washoku:my_favorites' %}?sort=family"{% if name == 'my_favorites' and sort == 'family' %} aria-current="page" class="is-current"{% endif %}>家族の評価順</a>
    <a href="{% url 'washoku:family_favorites' %}"{% if name == 'family_favorites' %} aria-current="page" class="is-current"{% endif %}>家族の好きな料理</a>
</nav>
{% endwith %}
