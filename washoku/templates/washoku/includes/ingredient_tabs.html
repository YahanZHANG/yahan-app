{% with name=request.resolver_match.url_name %}
<nav class="washoku-subtabs" aria-label="食材のページ">
    <a href="{% url 'washoku:ingredient_list' %}" class="{% if name == 'ingredient_list' %}active{% endif %}">食材</a>
    <a href="{% url 'washoku:substitute_list' %}" class="{% if name == 'substitute_list' or name == 'substitute_submit' %}active{% endif %}">代わり</a>
    <a href="{% url 'washoku:store_list' %}" class="{% if name == 'store_list' %}active{% endif %}">お店</a>
</nav>
{% endwith %}
