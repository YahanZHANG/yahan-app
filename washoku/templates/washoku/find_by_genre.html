{% extends "washoku/base.html" %}

{% block title %}カテゴリーで選ぶ | スイスで和食{% endblock %}

{% block content %}

<h1>カテゴリーで選ぶ</h1>

<div class="washoku-mood-grid">
    {% for value, label, count in genres %}
        <a class="washoku-mood" href="{% url 'washoku:recipe_list' %}?category={{ value }}">
            <strong>{{ label }}</strong>
            <small>{{ count }}品</small>
        </a>
    {% endfor %}
    <a class="washoku-mood" href="{% url 'washoku:recipe_list' %}?shop=1">
        <strong>スーパーだけで作れる</strong>
        <small>専門店いらず</small>
    </a>
</div>

<p class="washoku-more"><a href="{% url 'washoku:recipe_list' %}">すべてのレシピを見る</a></p>

{% endblock %}
