{% comment %}登録なしで書くときだけ: ニックネームとメール。書きはじめると出てくる。website は荒らし対策の見えない欄。
ニックネームは、こちらで決めた案 (guest_name_idea) が最初から入っている。送るとその名前でアカウントができて、この端末では次からもその名前 (2026-11-16 Taro){% endcomment %}
{% if not user.is_authenticated %}
<div class="cb-guest" data-guest>
    <input type="text" name="website" class="cb-hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label class="cb-field"><span>ニックネーム（次からもこの名前で書けます）</span><input type="text" name="guest_nickname" maxlength="30" value="{% if guest_nickname %}{{ guest_nickname }}{% else %}{{ guest_name_idea }}{% endif %}" autocomplete="nickname"></label>
    <label class="cb-field"><span>メールアドレス（任意）：回答がついたらお知らせ</span><input type="email" name="guest_email" maxlength="200" value="{{ guest_email|default:'' }}" autocomplete="email" inputmode="email"></label>
    <p class="cb-guest-note">登録なしで書けます。送信すると<a href="{% url 'chiebukuro:rules' %}" target="_blank">掲示板のルール</a>に同意したことになります。ログインしている方は<a href="{% url 'login' %}?next={{ request.get_full_path|urlencode }}">こちら</a></p>
</div>
{% endif %}
