{% extends "chiebukuro/base.html" %}
{% block title %}アカウントにする | スイス掲示板{% endblock %}
{% block content %}
<section class="cb-block cb-form-block">
    <h1 class="cb-form-title">IDとパスワードを決める</h1>
    <p class="cb-sub">いまは登録なしで、この端末だけで使っています（名前：{{ nickname }}）。IDとパスワードを決めると、これまでの質問・回答をそのままに、ほかのスマホやパソコンからも使えます。</p>
    {% if error %}<p class="cb-error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" class="cb-form">
        {% csrf_token %}
        <label class="cb-field"><span>ユーザーID（半角英数字）</span><input type="text" name="username" value="{{ username }}" required maxlength="150" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></label>
        <label class="cb-field"><span>パスワード（8文字以上）</span><input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
        <label class="cb-field"><span>メールアドレス（任意：パスワードを忘れたとき用）</span><input type="email" name="email" value="{{ email }}" maxlength="200" autocomplete="email"></label>
        <button type="submit" class="cb-btn cb-btn-primary">決める</button>
    </form>
</section>
{% endblock %}
