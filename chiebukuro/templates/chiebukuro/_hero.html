{# HOME のいちばん上: スイスの山の景色。空の色は時間 (昼・夜) と今日の天気 (晴れ・くもり・雨・雪) で変わる #}
<section class="cb-hero" id="cb-hero" data-time="{{ hero_time }}" data-sky="clear">
    <svg class="cb-hero-scene" viewBox="0 0 400 240" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
        <defs>
            <linearGradient id="cbSky" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" style="stop-color: var(--sky1)"/>
                <stop offset="1" style="stop-color: var(--sky2)"/>
            </linearGradient>
            <radialGradient id="cbGlow" cx=".5" cy=".5" r=".5">
                <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
                <stop offset="1" stop-color="#fff" stop-opacity="0"/>
            </radialGradient>
        </defs>
        <rect width="400" height="240" fill="url(#cbSky)"/>
        <g class="cb-stars" fill="#fff">
            <circle cx="40" cy="30" r="1"/><circle cx="92" cy="58" r=".8"/><circle cx="150" cy="22" r="1.2"/><circle cx="210" cy="48" r=".8"/>
            <circle cx="262" cy="18" r="1"/><circle cx="300" cy="62" r=".8"/><circle cx="352" cy="34" r="1.1"/><circle cx="380" cy="80" r=".7"/>
            <circle cx="120" cy="90" r=".7"/><circle cx="20" cy="76" r=".8"/>
        </g>
        <g class="cb-sun"><circle cx="330" cy="58" r="42" fill="url(#cbGlow)"/><circle cx="330" cy="58" r="17" fill="#FFE9A8"/></g>
        <g class="cb-moon"><circle cx="330" cy="54" r="34" fill="url(#cbGlow)" opacity=".5"/><circle cx="330" cy="54" r="13" fill="#FFF6D8"/><circle cx="336" cy="49" r="11" style="fill: var(--sky1)"/></g>
        <g class="cb-clouds">
            <g class="cb-cloud cb-cloud-a"><ellipse cx="70" cy="70" rx="30" ry="10"/><ellipse cx="86" cy="62" rx="17" ry="12"/><ellipse cx="60" cy="64" rx="12" ry="8"/></g>
            <g class="cb-cloud cb-cloud-b"><ellipse cx="250" cy="96" rx="26" ry="8"/><ellipse cx="262" cy="89" rx="14" ry="10"/></g>
            <g class="cb-cloud cb-cloud-c"><ellipse cx="170" cy="40" rx="22" ry="7"/><ellipse cx="180" cy="34" rx="12" ry="8"/></g>
        </g>
        <path d="M0 168 L46 132 L80 150 L128 112 L170 146 L214 120 L262 150 L318 116 L360 140 L400 122 L400 240 L0 240Z" style="fill: var(--m1)"/>
        <path d="M150 178 L238 74 L252 92 L266 86 L340 178Z" style="fill: var(--m2)"/>
        <path d="M223 92 L238 74 L252 92 L266 86 L276 98 L262 104 L252 98 L240 108 L230 100Z" fill="#fff" class="cb-snowcap"/>
        <path d="M0 196 C60 170 120 176 180 190 C240 204 300 180 400 186 L400 240 L0 240Z" style="fill: var(--h1)"/>
        <g class="cb-trees" style="fill: var(--tree)">
            <path d="M44 196 l8 -22 l8 22z"/><path d="M58 198 l6 -16 l6 16z"/><path d="M330 192 l8 -24 l8 24z"/><path d="M346 194 l6 -16 l6 16z"/>
        </g>
        <g class="cb-chalet">
            <rect x="262" y="190" width="40" height="22" style="fill: var(--wood)"/>
            <path d="M256 192 L282 172 L308 192Z" fill="#C8102E"/>
            <rect x="270" y="197" width="8" height="7" rx="1" class="cb-window"/><rect x="286" y="197" width="8" height="7" rx="1" class="cb-window"/>
            <path d="M318 212 V176" stroke="#9aa3ad" stroke-width="1.5"/>
            <g class="cb-flag"><rect x="318" y="176" width="13" height="13" fill="#D52B1E"/><path d="M322.9 179h3.2v2.7h2.7v3.2h-2.7v2.7h-3.2v-2.7h-2.7v-3.2h2.7z" fill="#fff"/></g>
        </g>
        <path d="M0 214 C80 202 160 206 230 214 C300 222 350 210 400 212 L400 240 L0 240Z" style="fill: var(--h2)"/>
        <g class="cb-rain" stroke="#E6F0FA" stroke-width="1.2" stroke-linecap="round" opacity=".55">
            <path d="M30 20 l-6 14M80 50 l-6 14M130 10 l-6 14M180 60 l-6 14M230 30 l-6 14M280 70 l-6 14M330 20 l-6 14M370 60 l-6 14M60 110 l-6 14M160 120 l-6 14M260 130 l-6 14M360 110 l-6 14"/>
        </g>
        <g class="cb-snowfall" fill="#fff" opacity=".9">
            <circle cx="30" cy="20" r="1.8"/><circle cx="80" cy="60" r="1.4"/><circle cx="130" cy="16" r="2"/><circle cx="180" cy="70" r="1.5"/><circle cx="230" cy="30" r="1.8"/>
            <circle cx="280" cy="80" r="1.4"/><circle cx="330" cy="24" r="2"/><circle cx="370" cy="64" r="1.6"/><circle cx="60" cy="120" r="1.5"/><circle cx="200" cy="130" r="1.8"/><circle cx="340" cy="120" r="1.4"/>
        </g>
    </svg>
    <div class="cb-hero-in">
        <p class="cb-hero-date">{{ today|date:"n月j日" }}（{{ today|date:"D" }}）</p>
        <h1 class="cb-hero-title">今週の知恵袋</h1>
        <p class="cb-hero-sub">スイスで暮らす日本人の、知恵と助け合い</p>
        <div class="cb-today" id="cb-today" data-url="{% url 'chiebukuro:today' %}" aria-live="polite"></div>
        <div class="cb-hero-foot">{% include "chiebukuro/_region.html" %}</div>
    </div>
</section>
