<ol class="cb-rules-list">
    <li>品物の売り買いはしません（無料のゆずりあい・貸し借りだけ）</li>
    <li>受け渡しはなるべく対面で（郵送するなら住所を知られない工夫を）</li>
    <li>住所・電話番号・メールは公開しない</li>
    <li>連絡は「2人だけのやりとり」で</li>
    <li>貸し借りは自己責任で</li>
    <li>危険なもの・違法なものは出さない</li>
    <li>お互いを尊重する</li>
    <li>困ったときは「通報」から</li>
    <li>ベストアンサーは質問した人が選ぶ（決まらないときは、2か月後に運営が選びます）</li>
    <li>トラブルは当事者どうしで解決（運営は責任を負いません）</li>
</ol>
<p class="cb-rules-more"><a href="{% url 'chiebukuro:rules' %}">ルールの全文を読む</a></p>
