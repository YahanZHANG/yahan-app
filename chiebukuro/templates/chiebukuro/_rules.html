<ol class="cb-rules-list">
    <li>品物の売り買いはしません（無料のゆずりあい・貸し借りだけ）</li>
    <li>受け渡しは対面で（郵送はなし）</li>
    <li>住所・電話番号・メールは公開しない</li>
    <li>連絡は「2人だけのやりとり」で</li>
    <li>貸し借りは自己責任で</li>
    <li>危険なもの・違法なものは出さない</li>
    <li>お互いを尊重する</li>
    <li>困ったときは「通報」から</li>
</ol>
