{% load static %}{% comment %}シェア: 画像カード (インスタのストーリーなど) と X。share_label / share_text / share_sub / share_url を渡す{% endcomment %}
<div class="cb-share{% if compact %} cb-share-compact{% endif %}" data-share data-label="{{ share_label }}" data-text="{{ share_text|truncatechars:140 }}" data-sub="{{ share_sub|default:''|truncatechars:120 }}" data-url="{{ share_url }}" data-icon="{% static 'pwa/swiss-board/icon-192.png' %}">
    <button type="button" class="{% if compact %}cb-textbtn{% else %}cb-btn cb-btn-s{% endif %} cb-share-ig" data-share-image title="画像にして、インスタのストーリーなどでシェア"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.3" cy="6.7" r="1.2" fill="currentColor"/></svg> Instagram{% if not compact %} でシェア{% endif %}</button>
    <a class="{% if compact %}cb-textbtn{% else %}cb-btn cb-btn-s{% endif %}" href="https://twitter.com/intent/tweet?text={{ share_text|truncatechars:80|urlencode }}%20%23スイス掲示板&amp;url={{ share_url|urlencode }}" target="_blank" rel="noopener">𝕏{% if not compact %} でシェア{% endif %}</a>
    <p class="cb-share-msg" data-share-msg role="status" hidden></p>
</div>
