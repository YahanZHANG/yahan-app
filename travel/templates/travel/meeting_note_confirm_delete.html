{% extends "travel/base.html" %}

{% block title %}
    家族会議メモを削除 | 旅行管理アプリ
{% endblock %}

{% block content %}
<div class="form-page">
    <div class="form-page-header">
        <a
            href="{% url 'travel:meeting_note_list' %}"
            class="back-link"
        >
            <i class="bi bi-chevron-left"></i>
            会議一覧へ戻る
        </a>

        <h2>家族会議メモを削除</h2>
    </div>

    <div class="app-card delete-confirm-card">
        <div class="delete-confirm-icon">
            <i class="bi bi-trash3"></i>
        </div>

        <h3>この会議メモを削除する？</h3>

        <div class="delete-schedule-summary">
            <strong>
                {{ meeting_note.discussed_at|date:"Y年n月j日" }}
            </strong>

            <span>
                {{ meeting_note.decisions|truncatechars:60 }}
            </span>
        </div>

        <p class="delete-warning">
            削除した会議メモは元に戻せない。
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="form-actions">
                <a
                    href="{% url 'travel:meeting_note_list' %}"
                    class="secondary-button"
                >
                    キャンセル
                </a>

                <button
                    type="submit"
                    class="danger-button"
                >
                    削除する
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
